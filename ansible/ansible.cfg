[defaults]
# Customer Service Agent - Ansible Configuration
# Automation Engineer Portfolio - Best Practices & Performance Optimization

# Inventory and connection settings
inventory = inventory/hosts.yml
host_key_checking = False
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400  # 24 hours

# Performance optimization
forks = 20
poll_interval = 15
stdout_callback = yaml
bin_ansible_callbacks = True

# SSH optimization for latency-sensitive operations
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# Parallel execution for cost optimization
strategy = free
max_fail_percentage = 25

# Logging and debugging
log_path = /var/log/ansible.log
display_skipped_hosts = False
display_ok_hosts = False
verbosity = 0

# Security settings
remote_user = ubuntu
private_key_file = ~/.ssh/id_rsa
ask_pass = False
ask_sudo_pass = False

# Environment-specific settings
[development]
inventory = inventory/hosts.yml
remote_user = ubuntu
private_key_file = ~/.ssh/id_rsa
forks = 5
timeout = 20

[staging]
inventory = inventory/hosts.yml
remote_user = ubuntu
private_key_file = ~/.ssh/id_rsa
forks = 10
timeout = 25

[production]
inventory = inventory/hosts.yml
remote_user = ubuntu
private_key_file = ~/.ssh/prod_key
forks = 15
timeout = 30
gathering = explicit

# Callback plugins for automation engineering
[callback_plugins]
callback_whitelist = timer, profile_tasks, log_plays

# Performance tuning for large-scale deployments
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o Compression=yes
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# Cost optimization settings
[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# Monitoring and observability
[callback_timer]
output_callback = timer

[callback_profile_tasks]
output_callback = profile_tasks

[callback_log_plays]
output_callback = log_plays 