---
# Customer Service Agent - Ansible Inventory
# Automation Engineer Portfolio - Multi-Environment Configuration
# Demonstrates: Environment management, server grouping, variable organization

all:
  children:
    # Development environment (cost-sensitive: minimal resources)
    development:
      hosts:
        dev-server-01:
          ansible_host: 192.168.1.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          deployment_environment: development
          google_api_key: "{{ lookup('env', 'GOOGLE_API_KEY_DEV') }}"
          kafka_bootstrap_servers: "192.168.1.20:9092"
          # Cost optimization: minimal resources
          resource_profile: minimal
          monitoring_enabled: false
          backup_enabled: false
          auto_scaling: false

    # Staging environment (balanced resources)
    staging:
      hosts:
        staging-server-01:
          ansible_host: 192.168.1.30
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          deployment_environment: staging
          google_api_key: "{{ lookup('env', 'GOOGLE_API_KEY_STAGING') }}"
          kafka_bootstrap_servers: "192.168.1.40:9092"
          # Balanced resources for testing
          resource_profile: balanced
          monitoring_enabled: true
          backup_enabled: true
          auto_scaling: true
          load_balancer: true

        staging-server-02:
          ansible_host: 192.168.1.31
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          deployment_environment: staging
          google_api_key: "{{ lookup('env', 'GOOGLE_API_KEY_STAGING') }}"
          kafka_bootstrap_servers: "192.168.1.40:9092"
          resource_profile: balanced
          monitoring_enabled: true
          backup_enabled: true
          auto_scaling: true
          load_balancer: true

    # Production environment (high availability)
    production:
      hosts:
        prod-server-01:
          ansible_host: 10.0.1.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/prod_key
          deployment_environment: production
          google_api_key: "{{ lookup('env', 'GOOGLE_API_KEY_PROD') }}"
          kafka_bootstrap_servers: "10.0.1.20:9092"
          # High availability configuration
          resource_profile: high_availability
          monitoring_enabled: true
          backup_enabled: true
          auto_scaling: true
          load_balancer: true
          ssl_enabled: true
          cdn_enabled: true

        prod-server-02:
          ansible_host: 10.0.1.11
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/prod_key
          deployment_environment: production
          google_api_key: "{{ lookup('env', 'GOOGLE_API_KEY_PROD') }}"
          kafka_bootstrap_servers: "10.0.1.20:9092"
          resource_profile: high_availability
          monitoring_enabled: true
          backup_enabled: true
          auto_scaling: true
          load_balancer: true
          ssl_enabled: true
          cdn_enabled: true

        prod-server-03:
          ansible_host: 10.0.1.12
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/prod_key
          deployment_environment: production
          google_api_key: "{{ lookup('env', 'GOOGLE_API_KEY_PROD') }}"
          kafka_bootstrap_servers: "10.0.1.20:9092"
          resource_profile: high_availability
          monitoring_enabled: true
          backup_enabled: true
          auto_scaling: true
          load_balancer: true
          ssl_enabled: true
          cdn_enabled: true

    # Database servers
    database:
      hosts:
        db-server-01:
          ansible_host: 192.168.1.50
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          database_type: chromadb
          database_port: 8000
          backup_enabled: true
          monitoring_enabled: true

    # Kafka servers
    kafka:
      hosts:
        kafka-server-01:
          ansible_host: 192.168.1.60
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          kafka_port: 9092
          zookeeper_port: 2181
          monitoring_enabled: true

        kafka-server-02:
          ansible_host: 192.168.1.61
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          kafka_port: 9092
          zookeeper_port: 2181
          monitoring_enabled: true

    # Monitoring servers
    monitoring:
      hosts:
        monitoring-server-01:
          ansible_host: 192.168.1.70
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          prometheus_port: 9090
          grafana_port: 3000
          alertmanager_port: 9093

    # Load balancers
    loadbalancer:
      hosts:
        lb-server-01:
          ansible_host: 192.168.1.80
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          nginx_port: 80
          ssl_port: 443
          ssl_enabled: true

  vars:
    # Global variables for all environments
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
    # Application configuration
    app_name: "customer-service-agent"
    app_user: "appuser"
    app_group: "appuser"
    app_directory: "/opt/{{ app_name }}"
    
    # Cost-sensitive resource allocation by environment
    resource_profiles:
      minimal:
        memory_limit: "512m"
        cpu_limit: "0.5"
        workers: 1
        max_connections: 100
        cache_size: "256m"
      balanced:
        memory_limit: "1g"
        cpu_limit: "1.0"
        workers: 2
        max_connections: 500
        cache_size: "512m"
      high_availability:
        memory_limit: "2g"
        cpu_limit: "2.0"
        workers: 4
        max_connections: 1000
        cache_size: "1g"
    
    # Security configuration
    firewall_ports:
      - 22   # SSH
      - 8000 # Application
      - 9092 # Kafka
      - 9090 # Prometheus
      - 3000 # Grafana
    
    # Backup configuration
    backup_retention_days: 30
    backup_schedule: "0 2 * * *"  # Daily at 2 AM
    
    # Monitoring configuration
    monitoring_interval: 60  # seconds
    alert_thresholds:
      cpu_usage: 80
      memory_usage: 80
      disk_usage: 85
      response_time: 2000  # milliseconds
    
    # Performance tuning
    performance_settings:
      max_file_descriptors: 65536
      tcp_keepalive_time: 300
      tcp_keepalive_intvl: 75
      tcp_keepalive_probes: 9
      vm_swappiness: 10
      vm_dirty_ratio: 15
      vm_dirty_background_ratio: 5 